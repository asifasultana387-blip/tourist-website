<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atithi Bandhu - Tourist Safety</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#eef3f7;
    color:#263238;
}

/* PHONE APP */
.app{
    width:390px;
    min-height:820px;
    margin:20px auto;
    background:#f8fafc;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.18);
    position:relative;
}

/* HEADER */
.header{
    padding:25px 22px 15px;
    background:white;
}

.header small{
    color:#777;
}

.header h1{
    font-size:25px;
    margin-top:4px;
}

.profile{
    position:absolute;
    right:20px;
    top:20px;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#4c416e;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

/* CONTENT */
.content{
    padding:15px 18px 100px;
}

/* SAFETY CARD */
.safety-card{
    background:linear-gradient(135deg,#30283f,#53466f);
    color:white;
    border-radius:22px;
    padding:22px;
    margin-bottom:18px;
}

.safety-card .score{
    font-size:45px;
    font-weight:bold;
    margin:8px 0;
}

.safe{
    color:#7ce3a1;
}

/* FEATURE GRID */
.features{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:20px;
}

.feature{
    background:white;
    border-radius:16px;
    padding:12px 5px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.05);
}

.feature:hover{
    transform:translateY(-2px);
}

.icon{
    font-size:24px;
    margin-bottom:6px;
}

.feature span{
    font-size:11px;
    color:#555;
}

/* SECTIONS */
.section-title{
    font-size:17px;
    font-weight:bold;
    margin:17px 0 10px;
}

.alert{
    background:#fff7e6;
    border-radius:15px;
    padding:13px;
    margin-bottom:10px;
    border-left:4px solid #f0a500;
}

.alert strong{
    display:block;
    margin-bottom:4px;
}

.service{
    background:white;
    padding:14px;
    border-radius:15px;
    margin-bottom:9px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.service-left{
    display:flex;
    gap:12px;
    align-items:center;
}

.service-icon{
    width:40px;
    height:40px;
    background:#edf1f8;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

.distance{
    color:#4e92b5;
    font-size:12px;
}

/* BUTTON */
.btn{
    border:none;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    background:#4d416c;
    color:white;
}

.btn-blue{
    background:#3d9eb5;
}

.btn-red{
    background:#d65c70;
}

.btn-green{
    background:#3e9b72;
}

/* SCREEN */
.screen{
    display:none;
}

.screen.active{
    display:block;
}

/* TOP BAR */
.topbar{
    background:white;
    padding:18px;
    display:flex;
    align-items:center;
    gap:12px;
}

.back{
    border:none;
    background:#edf1f5;
    border-radius:10px;
    padding:8px 12px;
    cursor:pointer;
}

/* DIGITAL ID */
.digital-card{
    background:linear-gradient(135deg,#40344f,#5b4c78);
    color:white;
    border-radius:22px;
    padding:22px;
    margin-bottom:15px;
}

.id-header{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.verified{
    color:#7ce3a1;
}

.person{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:48px;
    height:48px;
    background:white;
    color:#453957;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:18px;
}

.id-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:18px;
}

.id-item small{
    color:#cfc8d9;
    display:block;
    margin-bottom:3px;
}

.id-item strong{
    font-size:14px;
}

.qr-box{
    margin-top:20px;
    background:rgba(255,255,255,.12);
    border-radius:15px;
    padding:15px;
    display:flex;
    gap:15px;
    align-items:center;
}

.qr{
    width:65px;
    height:65px;
    background:
    linear-gradient(90deg,#fff 10%,transparent 10%,transparent 20%,#fff 20%,#fff 30%,transparent 30%),
    linear-gradient(#fff 10%,transparent 10%,transparent 20%,#fff 20%,#fff 30%,transparent 30%);
    background-size:22px 22px;
}

/* MAP */
.map{
    height:330px;
    border-radius:20px;
    margin:15px 0;
    position:relative;
    overflow:hidden;
    background:
    linear-gradient(25deg,transparent 45%,#d8e2df 46%,#d8e2df 49%,transparent 50%),
    linear-gradient(115deg,transparent 48%,#d8e2df 49%,#d8e
